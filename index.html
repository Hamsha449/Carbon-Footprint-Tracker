<!DOCTYPE html>
<html>
<head>
    <title>Carbon Footprint Tracker</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #808000;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        header {
            background-color: #800000;

        nav a {
            text-decoration: none;
            margin: 10px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
        }

        img {
            max-height: 35vh;
            width: auto;
            margin: 15px auto;
        }

        p {
            font-size: 16px;
            margin: 10px;
            color: #f0f0f0;
        }

        /* Start button styling */
        .start-btn {

            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;

        .start-btn:hover {

<!-- About page navigation -->
<nav>

</nav>

<img src="https://www.interreg-central.eu/wp-content/uploads/2024/11/AdobeStock_537514330-scaled-1.jpeg" alt="Save Earth">

based on transport, food habits, and electricity usage.
